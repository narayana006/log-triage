[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "log-triage"
version = "0.1.0"
description = "Collapse noisy logs into patterns and surface what is new or spiking compared with a baseline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
log-triage = "log_triage.cli:main"

[tool.setuptools]
packages = ["log_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
